name: secret-scan

# Server-side safety net: scans for committed secrets on every push and PR to main.
# Complements the local pre-commit hook (scripts/pre-commit-secrets.sh), which is
# per-clone and can be bypassed. This runs regardless of contributor setup.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # scan the whole history, not just the tip

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
