name: tests

# Unit tests for the loan-crew logic (deterministic model, guardrails, policy, reason codes).
# These are pure-Python and need NO AWS or LLM access, so they run in CI on every push/PR.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest
      - name: Run unit tests
        run: python -m pytest tests/ -q
